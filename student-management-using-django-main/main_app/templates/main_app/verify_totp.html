{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify Authentication Code</title>
    <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d1b2a;
            --bg-mid: #14324a;
            --bg-soft: #1b4b5f;
            --mint: #31d0aa;
            --mint-strong: #1ca985;
            --text-main: #f3f7fb;
            --text-muted: #b8cad8;
            --error-bg: rgba(224, 80, 85, 0.2);
            --error-border: rgba(255, 139, 145, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
            background:
                radial-gradient(circle at 18% 22%, rgba(49, 208, 170, 0.2), transparent 38%),
                radial-gradient(circle at 84% 78%, rgba(70, 139, 255, 0.25), transparent 42%),
                linear-gradient(125deg, var(--bg-deep), var(--bg-mid) 50%, var(--bg-soft));
            overflow: hidden;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            padding: 34px 30px;
            background: rgba(11, 26, 39, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 24px 45px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            animation: cardIn 0.45s ease-out;
        }

        .badge {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            margin-bottom: 16px;
            background: linear-gradient(145deg, #3fe9c0, #26b58f);
            color: #053a2f;
            font-size: 22px;
            box-shadow: 0 10px 20px rgba(49, 208, 170, 0.32);
        }

        h2 {
            margin: 0 0 8px;
            font-size: 30px;
            line-height: 1.2;
            letter-spacing: 0.2px;
        }

        p {
            margin: 0 0 20px;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .alert {
            border-radius: 12px;
            margin-bottom: 14px;
            padding: 11px 12px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: #ffd6d8;
            font-size: 14px;
        }

        .field-wrap {
            position: relative;
        }

        .field-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #7ecfb8;
            font-size: 15px;
        }

        .input {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-main);
            padding: 0 14px 0 42px;
            font-size: 18px;
            letter-spacing: 7px;
            text-align: center;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input::placeholder {
            color: rgba(194, 215, 229, 0.7);
        }

        .input:focus {
            outline: none;
            border-color: rgba(49, 208, 170, 0.95);
            box-shadow: 0 0 0 4px rgba(49, 208, 170, 0.2);
        }

        .btn {
            margin-top: 16px;
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--mint), var(--mint-strong));
            color: #02261d;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 14px 24px rgba(49, 208, 170, 0.32);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 26px rgba(49, 208, 170, 0.38);
        }

        .helper-text {
            margin-top: 12px;
            color: #9eb6c8;
            font-size: 12px;
            text-align: center;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 520px) {
            .card {
                padding: 28px 20px;
                border-radius: 20px;
            }

            h2 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge"><i class="fas fa-shield-alt"></i></div>
        <h2>Two-Factor Verification</h2>
        <p>Enter the 6-digit code from your Authenticator app.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'verify_totp' %}">
            {% csrf_token %}
            <div class="field-wrap">
                <i class="fas fa-key"></i>
                <input class="input" type="text" name="otp" maxlength="6" placeholder="123456" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" required>
            </div>
            <button class="btn" type="submit">Verify</button>
        </form>

        <div class="helper-text">Code expires every 30 seconds.</div>
    </div>
</body>
</html>
